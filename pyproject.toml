[project]
name = "coursovaya-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Oksana Tishina",email = "oxtishina@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "black (>=26.10.1,<27.0.0)"
]

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", ".git", "__pycache__", ".pytest_cache", ".mypy_cache", "htmlcov"]

[tool.black]
line-length = 119
target-version = ["py312"]
